name: Mypy Type Checker
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install uv
              uses: astral-sh/setup-uv@v2
            - name: Install dependencies
              run: uv sync
            - name: Run Mypy
              run: uv run mypy .